[project]
name = "proviso-api"
version = "0.1.0"
description = "FastAPI service for Proviso"
readme = "README.md"
authors = [
    { name = "Sandeep-Pasumarthi", email = "sivasandeeppasumarthi@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "proviso-core",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
proviso-core = { workspace = true }
