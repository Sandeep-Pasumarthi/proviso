services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: proviso
      POSTGRES_PASSWORD: proviso
      POSTGRES_DB: proviso
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proviso -d proviso"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
  
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
  
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: proviso-api:local
    environment:
      PROVISO_DATABASE_URL: postgresql+asyncpg://proviso:proviso@postgres:5432/proviso
      PROVISO_REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: