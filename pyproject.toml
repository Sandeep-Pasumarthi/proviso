[project]
name = "proviso"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "proviso-core",
    "proviso-api",
    "proviso-worker"
]

[tool.uv.sources]
proviso-core = { workspace = true }
proviso-api = { workspace = true }
proviso-worker = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/core",
    "apps/api",
    "apps/worker",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["proviso_core", "proviso_api", "proviso_worker"]